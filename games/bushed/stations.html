<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BUSHED stations</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #game { width: 100vw; height: 100vh; display: block; image-rendering: pixelated; cursor: none; }
    #ui { position: fixed; inset: 0; pointer-events: none; }
    #dev { position: fixed; right: 8px; top: 8px; z-index: 5; pointer-events: auto; background: rgba(20, 16, 12, 0.78); padding: 6px 9px;
      border: 1px solid #4a3f33; color: #e8dcc8; font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace; max-width: 300px; }
    #dev button { font: inherit; background: #2a231c; color: #e8dcc8; border: 1px solid #5a4d3e; margin: 1px; }
    body.shot #dev { display: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui"></div>
  <div id="dev">
    <b>BUSHED stations</b><br>
    <button id="b-cook">stove (cook)</button> <button id="b-forge">forge</button> <button id="b-walk">walk</button><br>
    <span>click the canvas to lock the mouse; E uses, S steps back</span>
    <pre id="dev-info" style="white-space:pre-wrap;margin:4px 0 0"></pre>
  </div>
  <script type="module" src="./src/dev/stations.ts"></script>
</body>
</html>
