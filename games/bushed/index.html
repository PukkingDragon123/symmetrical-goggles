<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BUSHED</title>
  <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
  <link rel="apple-touch-icon" href="./icon-180.png" />
  <link rel="preload" href="./assets/fonts/Alagard.ttf" as="font" type="font/ttf" crossorigin />
  <style>
    html, body { margin: 0; height: 100%; background: #07081a; overflow: hidden; }
    #game { width: 100vw; height: 100vh; display: block; image-rendering: pixelated; cursor: none; }
    #ui { position: fixed; inset: 0; pointer-events: none; }
    #bushed-loading { position: fixed; left: 0; top: 0; z-index: 100; image-rendering: pixelated; image-rendering: crisp-edges; pointer-events: none; transition: opacity 0.8s ease-in; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui"></div>
  <canvas id="bushed-loading" width="320" height="180" role="progressbar" aria-label="loading" aria-valuemin="0" aria-valuemax="100"></canvas>
  <!-- The loading screen: a hand-made pixel-art night at the cabin. This block is not run here: the script below
       hands it, with the canvas, to a worker (OffscreenCanvas), so it stays smooth while the game loads on the main
       thread. Everything is drawn from code at a crisp 320x180-ish grid and scaled up by whole pixels. -->
  <script id="bushed-loading-scene" type="text/x-bushed-scene">
function bushedScene(canvas, env) {
  'use strict';
  var BW = 320, BH = 180;                       // the composition; the canvas may be a little wider or taller
  var W = canvas.width, H = canvas.height, ox = 0, oy = 0;
  var g = canvas.getContext('2d', { alpha: false, willReadFrequently: true });
  var mk = env.makeCanvas;
  // ------------------------------------------------------------------------------------------- palette
  function hex(s) { var n = parseInt(s.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  function u32(s) { var c = hex(s); return (255 << 24 | c[2] << 16 | c[1] << 8 | c[0]) >>> 0; }
  var SKY = ['#06071a', '#090b22', '#0d102c', '#121638', '#181d44', '#1f2550', '#272e5c', '#303868', '#3a4272'];
  var P = {
    moon0: '#fff4d6', moon1: '#ece0b8', moon2: '#cbbf98', moon3: '#a89c7c',
    star0: '#ffffff', star1: '#b8c4f0', star2: '#7884bc', star3: '#4c5690',
    ridge: '#121733', far: '#0f132b', farTip: '#1c2348',
    mist0: '#2b3460', mist1: '#38427a', mist2: '#4a5690',
    near0: '#070912', near1: '#0b0f1c', near2: '#121a2a', nearRim: '#1d2a40',
    gr0: '#0a0f14', gr1: '#0f1720', gr2: '#16222a', gr3: '#1f3036', gr4: '#2c4448',
    dirt0: '#1c1b24', dirt1: '#272530', dirt2: '#3a3642',
    log0: '#160f0c', log1: '#2a1c14', log2: '#3e2a1c', log3: '#553a24', log4: '#6e4c2e',
    end0: '#3a281a', end1: '#7a5634', end2: '#a07848', end3: '#c49a62',
    tin0: '#14171f', tin1: '#232836', tin2: '#363d4e', tin3: '#4f586c', tin4: '#6e7a92',
    win0: '#fff2b8', win1: '#ffd06a', win2: '#f0943a', win3: '#a8521e', glow0: '#3c2716', glow1: '#66401c',
    smoke0: '#1e2338', smoke1: '#2b3150', smoke2: '#3d4466', smoke3: '#545c80',
    ember0: '#fff0a0', ember1: '#ffb040', ember2: '#e0602a', ember3: '#7a2a1c',
    fly0: '#f4ffb0', fly1: '#c8f060', fly2: '#5a7a2a',
    bark0: '#100b0c', bark1: '#1e1617', bark2: '#2e2222', bark3: '#45342c', bark4: '#5c4636',
    cut0: '#3a2616', cut1: '#9a7444', cut2: '#d0aa70', cut3: '#ecd09a',
    sp0: '#04080a', sp1: '#081210', sp2: '#0e1e1a', sp3: '#173028', sp4: '#244436', sp5: '#3a6250',
    chip0: '#f0d4a0', chip1: '#d0a464', chip2: '#9a6c3a', dust: '#e8d6b0', barkBit: '#3a2a22',
    spark0: '#fffbe0', spark1: '#ffd46a', spark2: '#ff8a30',
    runner: '#010206', eye0: '#ffe0a0', eye1: '#ff4030', eye2: '#901810',
    text: '#f4ead0', text2: '#c8b890', textSh: '#05060f'
  };
  // the lumberjack
  var LJ = {
    K: '#140c0e', P: '#ded4b6', H: '#b83a30', h: '#74201e', S: '#e0a47c', s: '#a86a4c', E: '#1a0c0a',
    B: '#6a4028', b: '#3e2416', R: '#c03a30', r: '#7a1e1c', X: '#26161a', Q: '#e86a50',
    L: '#2a1a12', l: '#8a6a30', J: '#3e4c6c', j: '#283250', O: '#523420', o: '#2c1a10',
    G: '#9a6c3e', g: '#5e3e22', W: '#c48c4c', w: '#7a4e28', A: '#c4ced8', a: '#64707e', Z: '#f6faff'
  };
  // ------------------------------------------------------------------------------------------- helpers
  var seed0 = 20251121;
  function rng(seed) { return function () { seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var R = rng(seed0);
  var BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  function bay(x, y) { return (BAY[(y & 3) * 4 + (x & 3)] + 0.5) / 16; }
  function hash(x, y) { var h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) | 0; h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; }
  function vnoise(x, y) { var xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    var a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  // a pixel surface: write colours into a Uint32 buffer, then put() once
  function Surf(w, h) {
    var c = mk(w, h), x = c.getContext('2d', { willReadFrequently: true }), d = x.createImageData(w, h), b = new Uint32Array(d.data.buffer);
    var s = { c: c, x: x, w: w, h: h, b: b,
      set: function (px, py, col) { px |= 0; py |= 0; if (px < 0 || py < 0 || px >= w || py >= h) return; b[py * w + px] = typeof col === 'number' ? col : u32(col); },
      get: function (px, py) { return px < 0 || py < 0 || px >= w || py >= h ? 0 : b[py * w + px]; },
      rect: function (px, py, rw, rh, col) { var cc = typeof col === 'number' ? col : u32(col); for (var j = 0; j < rh; j++) for (var i = 0; i < rw; i++) s.set(px + i, py + j, cc); },
      put: function () { x.putImageData(d, 0, 0); return s; } };
    return s;
  }
  // filled polygon (scanline, crisp): pts [[x,y],...], fn(x,y) -> colour or null
  function poly(s, pts, fn) {
    var y0 = 1e9, y1 = -1e9, i;
    for (i = 0; i < pts.length; i++) { y0 = Math.min(y0, pts[i][1]); y1 = Math.max(y1, pts[i][1]); }
    for (var y = Math.floor(y0); y <= Math.ceil(y1); y++) {
      var xs = [], yc = y + 0.5;
      for (i = 0; i < pts.length; i++) {
        var a = pts[i], b = pts[(i + 1) % pts.length];
        if ((a[1] <= yc && b[1] > yc) || (b[1] <= yc && a[1] > yc)) xs.push(a[0] + (yc - a[1]) / (b[1] - a[1]) * (b[0] - a[0]));
      }
      xs.sort(function (p, q) { return p - q; });
      for (var k = 0; k + 1 < xs.length; k += 2) for (var x = Math.round(xs[k]); x < Math.round(xs[k + 1]); x++) { var col = fn(x, y); if (col) s.set(x, y, col); }
    }
  }
  function line(s, x0, y0, x1, y1, col) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    var dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, e = dx + dy;
    for (;;) { s.set(x0, y0, col); if (x0 === x1 && y0 === y1) break; var e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
  }
  function disc(s, cx, cy, r, fn) { for (var y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++) for (var x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++) { var dd = Math.hypot(x + 0.5 - cx, y + 0.5 - cy); if (dd <= r) { var c = fn(x, y, dd); if (c) s.set(x, y, c); } } }
  // a sprite from rows of characters and a key
  function sprite(rows, key) {
    var h = rows.length, w = 0, i, j; for (i = 0; i < h; i++) w = Math.max(w, rows[i].length);
    var s = Surf(w, h); for (j = 0; j < h; j++) for (i = 0; i < rows[j].length; i++) { var ch = rows[j][i]; if (key[ch]) s.set(i, j, key[ch]); }
    return s.put();
  }
  function mirror(sp) { var c = mk(sp.w, sp.h), x = c.getContext('2d'); x.translate(sp.w, 0); x.scale(-1, 1); x.drawImage(sp.c, 0, 0); return { c: c, w: sp.w, h: sp.h }; }

  // ------------------------------------------------------------------------------------------- layout
  var GROUND = 152;          // the yard's ground line (composition y)
  var HORIZON = 127;         // where the far forest meets the field
  var MOON = { x: 266, y: 33, r: 11 };
  var CAB = { x: 20, base: 150 };
  var TREE = { x: 214, base: 153, cut: 13, w: 12, top: 30 };   // trunk centre, ground, cut height, trunk width
  var LUMBER = { x: 186, y: 153 };
  var layers = {};

  function buildSky() {
    var s = Surf(W, H), horizon = oy + HORIZON + 4, mx = ox + MOON.x, my = oy + MOON.y, mr = MOON.r;
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
      var t = clamp(y / horizon, 0, 1), f = Math.pow(t, 1.35) * (SKY.length - 1);
      // the moon's halo lifts the sky a few steps, dithered
      var dm = Math.hypot(x + 0.5 - mx, y + 0.5 - my);
      if (dm > mr) f += 2.6 * Math.pow(clamp(1 - (dm - mr) / 34, 0, 1), 2.2) + 0.9 * Math.pow(clamp(1 - (dm - mr) / 9, 0, 1), 1.5);
      f += (vnoise(x * 0.05, y * 0.11) - 0.5) * 0.5;
      f = clamp(f, 0, SKY.length - 1);
      var i0 = Math.floor(f), fr = f - i0;
      s.set(x, y, SKY[Math.min(SKY.length - 1, i0 + (fr > bay(x, y) ? 1 : 0))]);
    }
    // stars (the twinkling ones are drawn live)
    var rs = rng(77), n = Math.round(W * H / 520);
    twinkles = [];
    for (var k = 0; k < n; k++) {
      var sx = Math.floor(rs() * W), sy = Math.floor(Math.pow(rs(), 1.7) * (horizon - 26));
      if (Math.hypot(sx - mx, sy - my) < mr + 16) continue;
      var r2 = rs();
      if (r2 < 0.06) { twinkles.push({ x: sx, y: sy, ph: rs() * 7, sp: 0.6 + rs() * 1.8 }); continue; }
      s.set(sx, sy, r2 < 0.3 ? P.star1 : r2 < 0.65 ? P.star2 : P.star3);
    }
    // the moon: limb darkening, maria and three crisp craters
    disc(s, mx, my, mr, function (x, y, dd) {
      var u = (x + 0.5 - mx) / mr, v = (y + 0.5 - my) / mr;
      var mare = vnoise(u * 2.2 + 3, v * 2.2 + 1) * 0.7 + vnoise(u * 5 + 7, v * 5) * 0.3;
      var lit = 1 - dd / mr * 0.35 + (u * 0.25 - v * 0.15);
      var lv = lit - (mare > 0.55 ? 0.42 : mare > 0.47 ? 0.18 : 0);
      return lv > 0.88 + bay(x, y) * 0.08 ? P.moon0 : lv > 0.66 + bay(x, y) * 0.1 ? P.moon1 : lv > 0.45 ? P.moon2 : P.moon3;
    });
    [[-5, 2, 1.7], [2, -6, 1.1], [5, 3, 1.3], [-2, 7, 0.9]].forEach(function (c) {
      var cx = mx + c[0], cy = my + c[1];
      disc(s, cx, cy, c[2] + 0.3, function (x, y) { return y + 0.5 < cy ? P.moon3 : P.moon0; });
    });
    // far ridge and its spruce
    var rr = rng(5);
    var ridgeY = function (x) { return oy + HORIZON - 12 + 3 * Math.sin((x - ox) * 0.017 + 1.3) + 2.2 * Math.sin((x - ox) * 0.043 + 0.4) + 1.5 * vnoise(x * 0.08, 3); };
    for (var x3 = 0; x3 < W; x3++) { var ry = Math.round(ridgeY(x3)); for (var y3 = ry; y3 < H; y3++) s.set(x3, y3, P.ridge); }
    for (var x4 = -6; x4 < W + 6;) {
      var th = 6 + Math.floor(rr() * 14), base = ridgeY(x4) + 3;
      spruceSil(s, x4, base, th, P.far, P.farTip);
      x4 += 2 + Math.floor(rr() * 4);
    }
    layers.sky = s.put();
  }
  var twinkles = [];
  // a small spruce silhouette: tiers of drooping boughs
  function spruceSil(s, cx, base, h, col, tip) {
    for (var j = 0; j <= h; j++) {
      var y = Math.round(base - j), t = j / h, hw = (1 - t) * h * 0.28 + 0.4;
      var tier = (j % 3) / 3; hw *= 0.75 + tier * 0.45;
      for (var i = Math.round(-hw); i <= Math.round(hw); i++) s.set(cx + i, y, j >= h - 1 ? tip : col);
    }
    s.set(cx, Math.round(base - h - 1), tip);
  }

  function buildMist() {
    var w = W + 96, h = 26, s = Surf(w, h), per = w;
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
      var a = 2 * Math.PI * x / per;
      var n = 0.5 + 0.22 * Math.sin(a * 3 + 1) + 0.16 * Math.sin(a * 7 + 2.1) + 0.12 * Math.sin(a * 13 + 0.3);
      var prof = Math.exp(-Math.pow((y - 12) / 6.5, 2));
      var dns = prof * (0.35 + 0.75 * n) + 0.12 * Math.sin(a * 23 + y * 0.7) * prof;
      var b = bay(x, y);
      if (dns > 0.95 + b * 0.25) s.set(x, y, P.mist2); else if (dns > 0.6 + b * 0.3) s.set(x, y, P.mist1); else if (dns > 0.3 + b * 0.35) s.set(x, y, P.mist0);
    }
    layers.mist = s.put(); layers.mistW = w;
  }

  // the near treeline, the field, the cabin and its yard: everything that never moves
  function buildYard() {
    var s = Surf(W, H), r = rng(11);
    // near spruce framing the left and right edges, in front of the mist
    var nearTree = function (cx, base, h, hwMax) {
      for (var j = 0; j <= h; j++) {
        var y = Math.round(base - j), t = j / h, tier = ((j + (cx & 3)) % 5) / 5;
        var hw = Math.max(0.5, (1 - t) * hwMax * (0.62 + 0.5 * tier));
        for (var i = Math.round(-hw - 0.4); i <= Math.round(hw); i++) {
          var edge = i >= Math.round(hw) - 1 && t > 0.06;
          s.set(cx + i, y, edge && hash(cx + i, y) < 0.55 ? P.nearRim : (hash(cx + i, y) < 0.3 ? P.near1 : P.near0));
        }
      }
    };
    var lefts = [[ox + 2, 70, 16], [ox - 10, 92, 20], [ox + 26, 54, 12], [ox + 44, 44, 10], [ox + 60, 36, 9]];
    var rights = [[ox + 300, 60, 14], [ox + 316, 84, 18], [ox + 286, 40, 10], [ox + 330, 70, 16]];
    lefts.concat(rights).forEach(function (t) { nearTree(t[0], oy + HORIZON + 4, t[1], t[2]); });
    if (W > BW + 20) for (var e = 0; e < (W - BW) / 2; e += 14) { nearTree(e, oy + HORIZON + 4, 50 + (e % 30), 13); nearTree(W - e, oy + HORIZON + 4, 56 + (e % 26), 14); }
    // the field
    var fy = oy + HORIZON;
    for (var y = fy; y < H; y++) for (var x = 0; x < W; x++) {
      var t = (y - fy) / (H - fy), n = vnoise(x * 0.12, y * 0.35) + (vnoise(x * 0.5, y * 0.9) - 0.5) * 0.5;
      var lv = 1.2 - t * 0.9 + (n - 0.5) * 1.1;
      // the yard in front of the cabin is trodden and lighter
      var c = lv > 1.05 + bay(x, y) * 0.3 ? P.gr3 : lv > 0.62 + bay(x, y) * 0.3 ? P.gr2 : lv > 0.25 + bay(x, y) * 0.25 ? P.gr1 : P.gr0;
      s.set(x, y, c);
    }
    // grass tufts catching the moon
    for (var k = 0; k < W * 1.6; k++) {
      var gx = Math.floor(r() * W), gy = fy + 2 + Math.floor(Math.pow(r(), 0.8) * (H - fy - 2)), hgt = 1 + Math.floor(r() * (1 + (gy - fy) / 16));
      for (var q = 0; q < hgt; q++) s.set(gx + (q === hgt - 1 && r() < 0.5 ? 1 : 0), gy - q, q === hgt - 1 ? P.gr4 : P.gr3);
    }
    // the path from the door, worn into the field
    for (var py = oy + CAB.base; py < H; py++) {
      var tt = (py - oy - CAB.base) / (H - oy - CAB.base), pcx = ox + CAB.x + 44 - tt * 30 + Math.sin(tt * 3) * 6, pw = 3 + tt * 9;
      for (var px = Math.floor(pcx - pw); px <= pcx + pw; px++) {
        var ed = Math.abs(px - pcx) / pw;
        if (ed < 0.75 + (hash(px, py) - 0.5) * 0.4) s.set(px, py, ed < 0.4 + bay(px, py) * 0.3 ? P.dirt1 : P.dirt0);
        if (hash(px * 3, py) < 0.04) s.set(px, py, P.dirt2);
      }
    }
    drawCabin(s, ox + CAB.x, oy + CAB.base);
    drawWoodpile(s, ox + CAB.x - 16, oy + CAB.base + 1);
    // the stump the tree will leave behind is part of the tree; a sawbuck and a few rounds in the yard
    drawRounds(s, ox + 140, oy + GROUND + 3);
    layers.yard = s.put();
    // the foreground: tall dark grass along the bottom edge
    var f = Surf(W, H);
    for (var x5 = 0; x5 < W; x5++) {
      var hh = 2 + Math.floor(vnoise(x5 * 0.2, 1) * 6 + (hash(x5, 9) < 0.18 ? 4 : 0));
      for (var y5 = 0; y5 < hh; y5++) f.set(x5 + (y5 > hh - 3 && hash(x5, y5) < 0.4 ? 1 : 0), H - 1 - y5, y5 === hh - 1 ? P.near2 : P.near0);
    }
    for (var rk = 0; rk < 3; rk++) { var rx = ox + 108 + rk * 86 + Math.floor(r() * 20); disc(f, rx, H - 1, 5 + r() * 3, function (x, y, dd) { return y < H - 5 + (hash(x, y) < 0.5 ? 0 : 1) && dd > 3 ? P.near2 : P.near0; }); }
    layers.fore = f.put();
  }

  // the log cabin, gable end to us, the left side wall receding; (bx, by) = front-left corner on the ground
  function drawCabin(s, bx, by) {
    var fl = bx + 26, fr = bx + 82, eave = by - 26, apex = by - 47, mid = (fl + fr) / 2;   // front face
    var back = bx + 2, backTop = eave + 3, backBot = by - 3;                                // far end of the side wall
    // side wall (receding to the left): log courses that slope gently
    poly(s, [[back, backTop], [fl, eave], [fl, by], [back, backBot]], function (x, y) {
      var t = (x - back) / (fl - back), top = lerp(backTop, eave, t), bot = lerp(backBot, by, t), v = (y - top) / (bot - top);
      var course = v * 7, k = course - Math.floor(course);
      if (k < 0.16) return P.log0;
      if (k < 0.32) return P.log3;
      return hash(x, y) < 0.08 ? P.log1 : (k > 0.86 ? P.log1 : P.log2);
    });
    // log ends sticking out at the back corner
    for (var c = 0; c < 7; c++) { var yy = Math.round(lerp(backTop, backBot, (c + 0.55) / 7)); logEnd(s, back - 1, yy, 2); }
    // front face: horizontal logs up the gable
    poly(s, [[fl, by], [fl, eave], [mid, apex], [fr, eave], [fr, by]], function (x, y) {
      var v = (by - y) / 4, k = v - Math.floor(v);
      if (k > 0.82) return P.log0;
      if (k > 0.62) return P.log3;
      var chink = hash(Math.floor(x / 9), Math.floor(v)) < 0.25 && (x % 9) === 0;
      return chink ? P.log1 : (k < 0.18 ? P.log1 : (hash(x, y) < 0.07 ? P.log1 : P.log2));
    });
    // log ends at the front corners, one per course
    for (var c2 = 0; c2 < 7; c2++) { var yc = by - 2 - c2 * 4; logEnd(s, fl - 1, yc, 2); logEnd(s, fr + 1, yc, 2); }
    // the roof: the side plane over the side wall, then the front edge of the tin
    var rL = [fl - 8, eave + 3], rA = [mid, apex - 4], rR = [fr + 8, eave + 3];
    poly(s, [[back - 8, backTop + 1], rL, rA, [rA[0] - (fl - back) - 2, apex - 2]], function (x, y) {
      var rib = ((x + Math.round(y * 0.75)) % 3) === 0;
      var lit = (y - (apex - 4)) / (eave - apex + 6);
      return rib ? P.tin1 : (lit < 0.25 && hash(x, y) < 0.6 ? P.tin3 : P.tin2);
    });
    // fascia: the thick tin edge along both front slopes, moon-lit on the right

  <script>
  // Start the loading screen at once (before the game's modules have even downloaded). It runs in a worker on an
  // OffscreenCanvas where available, so long boot steps on the main thread never stall it.
  (function () {
    var cv = document.getElementById('bushed-loading'), src = document.getElementById('bushed-loading-scene').textContent;
    var fontUrl = new URL('assets/fonts/Alagard.ttf', location.href).href;
    function fit() {
      var dpr = window.devicePixelRatio || 1, vw = window.innerWidth * dpr, vh = window.innerHeight * dpr;
      var s = Math.max(1, Math.floor(Math.min(vw / 320, vh / 180)));
      var w = Math.ceil(vw / s), h = Math.ceil(vh / s);
      cv.style.width = (w * s / dpr) + 'px'; cv.style.height = (h * s / dpr) + 'px';
      cv.style.left = Math.floor((window.innerWidth - w * s / dpr) / 2) + 'px'; cv.style.top = Math.floor((window.innerHeight - h * s / dpr) / 2) + 'px';
      return [w, h];
    }
    var size = fit(), worker = null, scene = null, fell = null, gone = false, pct = 0;
    var workerSrc = src + '\n;(' + function () {
      var scene = null;
      self.onmessage = function (e) {
        var m = e.data;
        if (m.type === 'init') {
          m.canvas.width = m.w; m.canvas.height = m.h;
          scene = bushedScene(m.canvas, {
            makeCanvas: function (w, h) { return new OffscreenCanvas(w, h); },
            loadFont: function () { var f = new FontFace('Alagard', 'url(' + m.font + ')'); return f.load().then(function (ff) { self.fonts.add(ff); }); },
            onPercent: function (p) { self.postMessage({ type: 'pct', p: p }); }
          });
          var raf = self.requestAnimationFrame ? self.requestAnimationFrame.bind(self) : function (f) { return setTimeout(function () { f(performance.now()); }, 16); };
          var last = performance.now();
          var loop = function (now) { var dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now; scene.step(dt); scene.render(); raf(loop); };
          raf(loop);
        } else if (m.type === 'set') scene && scene.set(m.p, m.next);
        else if (m.type === 'resize') scene && scene.resize(m.w, m.h);
        else if (m.type === 'done') scene && scene.done().then(function () { self.postMessage({ type: 'fell' }); });
      };
    } + ')();';
    try {
      if (cv.transferControlToOffscreen && window.Worker && window.OffscreenCanvas && window.OffscreenCanvasRenderingContext2D) {
        var off = cv.transferControlToOffscreen();
        worker = new Worker(URL.createObjectURL(new Blob([workerSrc], { type: 'text/javascript' })));
        worker.onmessage = function (e) { if (e.data.type === 'fell' && fell) fell(); else if (e.data.type === 'pct') { pct = e.data.p; cv.setAttribute('aria-valuenow', pct); } };

      }
    } catch (e) { worker = null; }
    if (!worker) {
      // the same scene on the main thread
      cv.width = size[0]; cv.height = size[1];
      scene = (new Function(src + '\nreturn bushedScene;'))()(cv, {
        makeCanvas: function (w, h) { if (window.OffscreenCanvas) return new OffscreenCanvas(w, h); var c = document.createElement('canvas'); c.width = w; c.height = h; return c; },
        loadFont: function () { var f = new FontFace('Alagard', 'url(' + fontUrl + ')'); return f.load().then(function (ff) { document.fonts.add(ff); }); },
        onPercent: function (p) { cv.setAttribute('aria-valuenow', p); }
      });
      var last = performance.now();
      (function loop(now) { if (gone) return; var dt = Math.min(0.05, Math.max(0, ((now || last) - last) / 1000)); last = now || last; scene.step(dt); scene.render(); requestAnimationFrame(loop); })();
    }
    window.addEventListener('resize', function () { var s2 = fit(); if (worker) worker.postMessage({ type: 'resize', w: s2[0], h: s2[1] }); else if (scene) scene.resize(s2[0], s2[1]); });
    function hide() {
      if (gone) return; gone = true;
      cv.style.opacity = '0';
      setTimeout(function () { cv.remove(); if (worker) worker.terminate(); }, 900);
    }
    window.__bushedLoading = {
      set: function (p, next) { if (worker) worker.postMessage({ type: 'set', p: p, next: next }); else if (scene) scene.set(p, next); },
      /** 100 %: the tree falls; resolves once the screen has faded */
      done: function () {
        return new Promise(function (res) {
          var finished = false;
          var finish = function () { if (finished) return; finished = true; removeEventListener('keydown', finish, true); removeEventListener('pointerdown', finish, true); hide(); setTimeout(res, 850); };
          var cap = setTimeout(finish, 6000);

        });
      },
      hide: hide,
      /** the scene itself (main-thread fallback only; the test page uses it) */
      scene: function () { return scene; }
    };
    window.__bushedLoading.set(0.01, 0.06);
  })();
