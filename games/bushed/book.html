<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BUSHED: the Book of Cryptids</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0c0b; color: #d8d2c0; font: 16px Alagard, monospace; overflow: hidden; }
    @font-face { font-family: Alagard; src: url(assets/fonts/Alagard.ttf); }
    #game { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
    #ui { position: fixed; inset: 0; pointer-events: none; }
    #panel { position: fixed; top: 8px; left: 8px; background: rgba(10, 10, 9, 0.8); padding: 8px 10px; border: 1px solid #3a342a; pointer-events: auto; max-width: 420px; line-height: 1.3; }
    #panel button { background: #221d16; color: #e6dcc4; border: 1px solid #5a4c36; font: 16px Alagard, monospace; margin: 2px 2px 0 0; padding: 1px 6px; cursor: pointer; }
    #panel .k { color: #e2a35a; }
    body.shot #panel { display: none; }
    #sheet { position: fixed; inset: 0; overflow: auto; background: #151311; display: none; padding: 12px; image-rendering: pixelated; }
    #sheet canvas { image-rendering: pixelated; margin: 6px; vertical-align: top; }
    body.sheet #sheet { display: block; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui"></div>
  <div id="sheet"></div>
  <div id="panel">
    <div><span class="k">Tab</span> open / shut &nbsp; <span class="k">A D</span> turn &nbsp; <span class="k">O</span> taste the critter &nbsp; <span class="k">L</span> learn a rule</div>
    <div id="buttons"></div>
    <div id="info"></div>
  </div>
  <script type="module" src="./src/dev/book.ts"></script>
</body>
</html>
