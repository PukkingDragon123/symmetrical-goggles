<!doctype html><html><head><meta charset="utf-8"><title>audio test</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;background:#15171a;color:#d6d3cc;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace}
#wrap{display:flex;height:100vh}
#list{flex:1 1 55%;overflow:auto;padding:8px 10px;border-right:1px solid #2a2d33}
#side{flex:1 1 45%;overflow:auto;padding:8px 10px}
h2{font-size:13px;margin:14px 0 4px;color:#f0c674;border-bottom:1px solid #2a2d33}
h3{font-size:12px;margin:10px 0 4px;color:#8abeb7}
.row{display:flex;align-items:center;gap:6px;padding:2px 0;flex-wrap:wrap}
.row .id{width:190px;color:#e8e6e1}.row .meta{width:150px;color:#7d8088}
button{background:#2a2d33;color:#d6d3cc;border:1px solid #3a3e46;border-radius:3px;padding:1px 6px;font:inherit;cursor:pointer}
button:hover{background:#3a3e46}button.on{background:#5a7d3a;border-color:#7fae52}
label{display:flex;align-items:center;gap:6px;margin:2px 0}label span{width:110px}
input[type=range]{width:180px}
canvas{background:#0d0f12;border:1px solid #2a2d33;display:block;margin:6px 0}
#gate{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;z-index:9}
#stats{color:#7d8088}
input[type=search]{background:#0d0f12;color:#d6d3cc;border:1px solid #3a3e46;padding:3px 6px;font:inherit;width:240px}
</style></head>
<body>
<div id="gate">click to start audio</div>
<div id="wrap">
  <div id="list"><input id="filter" type="search" placeholder="filter sounds (id or folder)"> <span id="stats"></span><div id="sounds"></div></div>
  <div id="side"></div>
</div>
<script type="module" src="/src/dev/audio.ts"></script>
</body></html>
