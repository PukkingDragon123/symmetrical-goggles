<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BUSHED - humans and first-person arms</title>
  <style>
    html, body { margin: 0; height: 100%; background: #6f7a78; overflow: hidden; font: 12px/1.3 monospace; }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    #hud { position: fixed; left: 8px; top: 8px; color: #fff; text-shadow: 0 1px 2px #000; white-space: pre; pointer-events: none; }
    #ui { position: fixed; left: 8px; bottom: 8px; display: flex; flex-wrap: wrap; gap: 4px; max-width: 70vw; }
    #ui button { font: 11px monospace; padding: 3px 6px; background: #2b2f2e; color: #e8e2d0; border: 1px solid #555; cursor: pointer; }
    #ui button.on { background: #a33a1c; }
    #page { position: fixed; right: 8px; top: 8px; width: 512px; image-rendering: pixelated; border: 1px solid #000; display: none; }
  </style>
</head>
<body>
  <div id="hud"></div>
  <div id="ui"></div>
  <canvas id="page"></canvas>
  <script type="module" src="./src/dev/humans.ts"></script>
</body>
</html>
