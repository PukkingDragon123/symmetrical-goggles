<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BUSHED places</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #e8dcc8; font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace; overflow: hidden; }
    #game { width: 100vw; height: 100vh; display: block; image-rendering: pixelated; }
    #ui { position: fixed; left: 8px; top: 8px; z-index: 2; background: rgba(20, 16, 12, 0.78); padding: 6px 9px; border: 1px solid #4a3f33; max-width: 360px; }
    #ui button, #ui select { font: inherit; background: #2a231c; color: #e8dcc8; border: 1px solid #5a4d3e; margin: 1px; }
    #info { margin-top: 4px; white-space: pre-wrap; color: #bfb3a0; }
    body.shot #ui { display: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui">
    <b>BUSHED places</b>
    <div id="views"></div>
    <label>hour <input id="hour" type="range" min="0" max="24" step="0.1" /></label>
    <button id="lamps">lamps</button> <button id="fire">stove fire</button> <button id="pit">fire pit</button>
    <div id="info">drag to look, WASD/QE to fly (shift = fast), 1-6 viewpoints</div>
  </div>
  <script type="module" src="./src/dev/places.ts"></script>
</body>
</html>
