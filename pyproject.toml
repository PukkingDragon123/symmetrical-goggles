[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lowpix"
version = "0.1.0"
description = "Code-first low-poly modeller with procedurally hand-painted pixel-art textures, built for AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.22", "Pillow>=9.0"]

[project.scripts]
lowpix = "lowpix.cli:main"
lowpix-mcp = "lowpix.mcp_server:main"

[tool.setuptools]
packages = ["lowpix"]

[tool.setuptools.package-data]
lowpix = ["schema.json", "mc_runtime/*.java", "styles/*.json"]
